name: lading

services:
  # Oracle: the TCP sink that counts received bytes and owns the "load arrived"
  # assertion. Always up, healthchecked, never faulted.
  sink:
    container_name: sink
    hostname: sink
    platform: linux/amd64
    init: true
    build:
      context: ../../../..
      dockerfile: test/antithesis/scenarios/general/Dockerfile
      target: sink
    image: sink:${ANTITHESIS_IMAGE_TAG:-latest}
    environment:
      NO_COLOR: "1"
    healthcheck:
      # /dev/tcp avoids needing curl in the image.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000'"]
      interval: 2s
      timeout: 2s
      retries: 30

  # System under test: the instrumented lading, pushing TCP load at the sink.
  lading:
    container_name: lading
    hostname: lading
    platform: linux/amd64
    init: true
    build:
      context: ../../../..
      dockerfile: test/antithesis/scenarios/general/Dockerfile
      target: lading
    image: lading:${ANTITHESIS_IMAGE_TAG:-latest}
    environment:
      NO_COLOR: "1"
      RUST_LOG: "info"
      # Must match the writer (first_sample_config) so both ends of the handoff
      # agree on the shared-config directory.
      CONFIG_DIR: "/shared"
    volumes:
      # first_sample_config (workload) writes this timeline's lading.yaml + ready
      # sentinel here; lading's entrypoint blocks on it, then boots under it.
      - shared:/shared:ro
    depends_on:
      sink:
        condition: service_healthy

  # Driver: emits setup_complete then idles. lading drives the load, so this is
  # the seam where config-variation test commands land later.
  workload:
    container_name: workload
    hostname: workload
    platform: linux/amd64
    init: true
    build:
      context: ../../../..
      dockerfile: test/antithesis/scenarios/general/Dockerfile
      target: workload
    image: workload:${ANTITHESIS_IMAGE_TAG:-latest}
    environment:
      NO_COLOR: "1"
      CONFIG_DIR: "/shared"
    volumes:
      - shared:/shared
    depends_on:
      sink:
        condition: service_healthy

volumes:
  # Carries the sampled lading.yaml + ready sentinel from workload to lading.
  shared:
