[advisories]
ignore = [
    "RUSTSEC-2020-0159",
    "RUSTSEC-2026-0001",  # rkyv 0.7.46 UB in Arc/Rc - optional dep of rust_decimal <- byte-unit, never compiled
    "RUSTSEC-2026-0235",  # rkyv 0.7.46 OOB read - optional dep of rust_decimal <- byte-unit, never compiled
    "RUSTSEC-2026-0542",  # humantime unmaintained - removed by #1949
    "RUSTSEC-2026-0543",  # chrono unmaintained - pulled in by arrow, parquet and kube
    "RUSTSEC-2026-0592",  # url Url::origin stack overflow - never called by lading, reqwest or bollard; remove once url 2.5.9 ships
]

[output]
deny = ["unmaintained", "unsound", "yanked"]
quiet = false
