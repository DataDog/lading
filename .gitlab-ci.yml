include:
  - .gitlab/fuzz.yml

stages:
  - fuzz

variables:
  DOCKER_RUNNER_REGISTRY: "registry.ddbuild.io/docker"
  DOCKER_RUNNER_IMAGE_TAG: "24.0.4-gbi-focal"
  REPO_CI_REGISTRY: "registry.ddbuild.io/images/ci/lading-fuzz"

ci-container-image:
  stage: .pre
  image: "$DOCKER_RUNNER_REGISTRY:$DOCKER_RUNNER_IMAGE_TAG"
  # GitLab runners reject unsigned images, so sign the image after the push.
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  script: |
    IMAGE_TAG="${REPO_CI_REGISTRY}:$(date --utc +%Y-%m-%d)-${CI_COMMIT_SHORT_SHA}"
    METADATA_FILE=$(mktemp)
    docker buildx build -t "${IMAGE_TAG}" --push --metadata-file "${METADATA_FILE}" . -f ci/Dockerfiles/Dockerfile.fuzz
    ddsign sign "${IMAGE_TAG}" --docker-metadata-file "${METADATA_FILE}"
  when: manual
  except:
    - tags
    - schedules
  tags:
    - "arch:amd64"
