[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lading-py"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "datadog>=0.49",
    "pydantic>=2",
    "PyYAML>=6",
    "aiohttp>=3.9",
    "backports.zstd>=1.5",
    "prometheus-client>=0.20",
    "pyarrow>=15",
    "structlog>=24",
]

[project.scripts]
lading-py = "lading_py.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
