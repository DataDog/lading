[package]
name = "lading-capture-reference-v1"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# A separate resolver and lockfile keep writer updates independent of the baseline.
[workspace]
resolver = "2"

[dependencies]
arrow-array = { version = "=57.3.0", default-features = false }
bytes = "=1.11.1"
parquet = { version = "=57.3.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
uuid = { version = "=1.23.0", default-features = false }

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rust]
warnings = "deny"
missing_docs = "deny"
